<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Registration page | Login with MVC</title>
</head>
<body>
	<h1>Welcome to the Login System with MVC</h1>
	
	<form method="post" action="./Register">
		
		<input type="text" name="name" placeholder="Enter name: "/>
		<br/><br/>
		<input type="email" name="email;" placeholder="Enter your Email: "/>
		<br/><br/>
		<input type="password" name="password" placeholder="Whats your password"/>
		<br/><br/>
		<input type="text" name="town" placeholder="Where you from: "/>
		<br/><br/>
		<input type="submit" value="Submit" />
	</form>

</body>
</html>
